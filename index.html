<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>普通公差計算機</title>
<meta name="description" content="寸法を入れると、機械加工（JIS B 0405・B 0419）・樹脂成形品（DIN 16901）・鋳造品（JIS B 0403）・ゴム製品（ISO 3302-1）の普通公差と、鋼板・ステンレス鋼板・アルミ板・アルミ押出形材の板厚許容差を表示する">
<link rel="canonical" href="https://kotaooka.github.io/gentol-calc/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="QC Workbench">
<meta property="og:title" content="普通公差計算機｜機械加工・樹脂・鋳造・ゴム・板厚">
<meta property="og:description" content="寸法を入れると、機械加工（JIS B 0405・B 0419）・樹脂成形品（DIN 16901）・鋳造品（JIS B 0403）・ゴム製品（ISO 3302-1）の普通公差と、鋼板・ステンレス鋼板・アルミ板・アルミ押出形材の板厚許容差を表示する">
<meta property="og:url" content="https://kotaooka.github.io/gentol-calc/">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://kotaooka.github.io/gentol-calc/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="普通公差計算機：寸法と規格から出した普通公差と、該当欄を強調した早見表">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1d5c96" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="普通公差">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script>
  // 保存したテーマ（auto / light / dark）を描画前に当てる。キーは QC Workbench の全ツールで共通
  try { const t = localStorage.getItem("qc-workbench-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* 保存できない環境 */ }
</script>
<style>
/* レイアウト：スマホは上から ① 寸法 → ② 規格（各規格の値と条件の要約を先に表示）→ ③ 結果と条件 → 早見表。幅 900 px 以上は左に ①②、右に ③ の 2 列。配色・字体は QC Workbench の DESIGN.md に従う */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #15212c; --ink2: #475563; --muted: #74818e;
  --line: #d5dce3; --grid: #e4e9ee; --accent: #1d5c96; --accent-ink: #ffffff; --accent-weak: #e1ebf5;
  --warn: #8a5300; --warn-weak: #f8ecd9; --ng: #ad2a22; --ng-weak: #f8e4e2;
  --f-ui: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #19212a; --ink: #e6ecf2; --ink2: #a9b5c1; --muted: #7d8996;
    --line: #2b3641; --grid: #253039; --accent: #6ba6df; --accent-ink: #0d1620; --accent-weak: #1c2f43;
    --warn: #e3a84e; --warn-weak: #36280f; --ng: #f07a70; --ng-weak: #3a1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #19212a; --ink: #e6ecf2; --ink2: #a9b5c1; --muted: #7d8996;
  --line: #2b3641; --grid: #253039; --accent: #6ba6df; --accent-ink: #0d1620; --accent-weak: #1c2f43;
  --warn: #e3a84e; --warn-weak: #36280f; --ng: #f07a70; --ng-weak: #3a1c1a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; text-autospace: normal; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
header.top { background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in, .wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.15rem; margin: 0; letter-spacing: .02em; }
.brand .std, .brand .home, .brand .crumb { font-size: .78rem; color: var(--muted); }
.brand .home { text-decoration: none; margin-right: -6px; }
.brand .home:hover { color: var(--accent); text-decoration: underline; }
.brand .crumb { margin-right: -6px; }
.brand .theme { margin-left: auto; }
.wrap { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.box h2 { font-size: .95rem; margin: 0; display: flex; align-items: center; gap: 8px; }
.step { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 500 .8rem var(--f-num); flex: none; }
.box h3 { font-size: .85rem; margin: 0; color: var(--ink2); }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }
.hint code { font-family: var(--f-num); color: var(--ink2); }
.lb, .nm { font-size: .8rem; color: var(--ink2); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }

/* 2 列（PC）と 1 列（スマホ） */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 900px) { .layout { grid-template-columns: minmax(0, 420px) minmax(0, 1fr); } }
.std2 { font-weight: 400; font-size: .78rem; color: var(--muted); }
.res { display: flex; flex-direction: column; gap: 12px; }
#step3 { scroll-margin-top: calc(8px + env(safe-area-inset-top, 0px)); }

/* ① 寸法 */
.dimrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.dimrow .field { display: flex; flex-direction: column; gap: 4px; }
#dim { width: 100%; max-width: 14ch; font: 500 1.9rem/1.2 var(--f-num); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
#dim.bad { border-color: var(--ng); background: var(--ng-weak); }

/* ② 規格 */
.groups { display: flex; flex-direction: column; gap: 12px; }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pick button { min-height: 64px; text-align: left; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pick button:hover { border-color: var(--accent); }
.pick button[aria-pressed="true"] { background: var(--accent-weak); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pick .pn { font-weight: 700; font-size: .9rem; }
.pick .pv { font: 500 1.15rem var(--f-num); font-variant-numeric: tabular-nums; }
.pick .pv.na { font: .76rem var(--f-ui); color: var(--muted); }
.pick .ps { font-size: .74rem; color: var(--muted); overflow-wrap: anywhere; }
.pick .pn { overflow-wrap: anywhere; }
.pick button.off { opacity: .55; }
.pick button.off[aria-pressed="true"] { opacity: 1; }

/* ③ 結果と条件 */
.conds { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
select, input[type="text"] { width: 100%; font: inherit; font-size: .88rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
input[type="text"] { font: 500 .95rem var(--f-num); }
.chk { display: flex; gap: 6px; align-items: flex-start; font-size: .82rem; color: var(--ink2); }
.chk input { margin-top: 4px; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--bg); color: var(--ink2); font: .86rem var(--f-ui); padding: 6px 12px; min-height: 40px; cursor: pointer; }
.seg.mono button { font: 500 .88rem var(--f-num); padding: 6px 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.desig { font-size: .85rem; background: var(--accent-weak); border-radius: 6px; padding: 6px 10px; }
.hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.hero .big { font: 500 2.4rem/1.15 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero .big small { font-size: 1.4rem; color: var(--accent); margin-left: 6px; }
.hero .lim { font: 500 1.1rem var(--f-num); color: var(--ink2); }
.hero .sub2 { flex-basis: 100%; font-size: .82rem; color: var(--ink2); }
.msg { border-radius: 6px; padding: 8px 10px; font-size: .86rem; }
.msg.warn { background: var(--warn-weak); color: var(--warn); }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
.strip button { min-height: 48px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; text-align: center; font-family: var(--f-num); font-size: .88rem; cursor: pointer; }
.strip button b { display: block; font: .72rem var(--f-ui); color: var(--muted); }
.strip button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); }
.strip button:hover { border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .t { font-size: .78rem; color: var(--ink2); }
.card .v { font: 500 1.15rem var(--f-num); font-variant-numeric: tabular-nums; }
.card .v.na { color: var(--muted); font-size: .9rem; font-family: var(--f-ui); }
.card .s { font-size: .74rem; color: var(--muted); }
.sub { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
ul.rules { margin: 0; padding-left: 1.2em; font-size: .82rem; color: var(--ink2); display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* 早見表 */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th { font-weight: 400; color: var(--ink2); text-align: left; padding: 5px 8px; white-space: nowrap; }
td { padding: 5px 8px; white-space: nowrap; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
thead th { border-bottom: 1px solid var(--line); font-size: .76rem; }
tbody tr + tr td, tbody tr + tr th { border-top: 1px solid var(--grid); }
.qt td.hl, .qt th.hl { background: var(--accent-weak); }
.qt td.hit { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.qt td.q { text-decoration: underline dotted var(--warn); text-underline-offset: 3px; }
.qt tbody th { font-family: var(--f-num); color: var(--ink); }
.qt td.unk { color: var(--muted); font-family: var(--f-ui); font-size: .76rem; }
.tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 18px; }
.qwrap { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.src { font-size: .76rem; color: var(--muted); margin: 0; }
.src b { color: var(--warn); font-weight: 400; }
.flag { color: var(--warn); }
footer { font-size: .78rem; color: var(--muted); }
footer a { color: inherit; }
.support a { white-space: nowrap; }
@media print { .support { display: none !important; } }
details.qt-box { display: block; }
details.qt-box > .tables { margin-top: 12px; }
details.qt-box > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
details.qt-box > summary::-webkit-details-marker { display: none; }
details.qt-box > summary::after { content: "開く"; margin-left: auto; font-size: .8rem; color: var(--accent); }
details.qt-box[open] > summary::after { content: "閉じる"; }
details.qt-box > summary h2 { margin: 0; }
/* スマホ：iOS で入力時に拡大されないよう 16px 以上、押しやすい大きさ */
@media (max-width: 899px) {
  select, input[type="text"] { font-size: 16px; min-height: 44px; }
  .hero .big { font-size: 2rem; }
  .hero .big small { font-size: 1.2rem; }
  .btn { min-height: 44px; }
}
@media (max-width: 340px) { .pick { grid-template-columns: minmax(0, 1fr); } }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: .85rem; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <a class="home" href="https://kotaooka.github.io/" title="QC Workbench（ツール一覧）へ戻る">QC Workbench</a><span class="crumb" aria-hidden="true">›</span><h1>普通公差計算機</h1>
      <span class="std">機械加工 / 樹脂 / 鋳造 / ゴム / 板厚</span>
      <button class="btn theme" id="themeBtn" type="button" aria-label="表示テーマを切り替え">表示：自動</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="layout">
    <div class="col">
      <section class="box">
        <h2><span class="step">1</span>寸法を入れる</h2>
        <div class="field"><label class="lb" for="dim">寸法 [mm]</label><input id="dim" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="25" enterkeyhint="done"></div>
        <div class="field"><span class="nm">寸法の種類（機械加工で使い分けます）</span>
          <div class="seg" id="kind" role="group" aria-label="寸法の種類"><button type="button" data-v="lin">長さ</button><button type="button" data-v="ch">面取り・丸み</button><button type="button" data-v="ang">角度</button></div>
        </div>
        <p class="hint" id="dimNote" aria-live="polite"></p>
      </section>

      <section class="box">
        <h2><span class="step">2</span>規格を選ぶ</h2>
        <div class="groups" id="pick"></div>
        <p class="hint">値は、下の小さな字の条件で引いた公差です。条件は選んだあとの結果の欄で変えられます。</p>
      </section>
    </div>

    <section class="box col" id="step3">
      <h2><span class="step">3</span><span id="resTitle">結果</span><span class="std2" id="resSub"></span></h2>
      <div class="res" id="resTop"></div>
      <h3 id="condsHead">条件</h3>
      <div class="conds" id="conds"></div>
      <div class="res" id="resBottom"></div>
    </section>
  </div>

  <details class="box qt-box" id="qtDetails" open>
    <summary><h2>早見表</h2></summary>
    <div class="tables" id="tables"></div>
  </details>

  <footer>
    <a href="https://github.com/kotaooka/gentol-calc">GitHub</a> ・ MIT License<span class="support"> ・ <a href="https://buymeacoffee.com/kotaooka" target="_blank" rel="noopener"><span aria-hidden="true">☕</span> 開発を応援する（Buy Me a Coffee）</a></span>
  </footer>
</main>
<div id="toast" hidden></div>

<script src="js/tables.js"></script>
<script src="js/app.js"></script>
</body>
</html>
